services:
  postgres-test:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: inmeta
      POSTGRES_PASSWORD: inmeta
      POSTGRES_DB: inmeta_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inmeta"]
      interval: 2s
      timeout: 3s
      retries: 10
