services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: inmeta
      POSTGRES_PASSWORD: inmeta
      POSTGRES_DB: inmeta
    ports:
      - "5432:5432"
    volumes:
      - inmeta-postgres-data:/var/lib/postgresql/data

volumes:
  inmeta-postgres-data:
